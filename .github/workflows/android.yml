name: Android-App bauen

# Baut die Play-Store-Datei (.aab) der Nahfuchs-App. Läuft bei Änderungen im Ordner android/ oder per Hand.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # nur um die fertige App-Datei im Zweig android-release abzulegen

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Upload-Schlüssel bereitstellen (nur aus GitHub-Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Secret ANDROID_KEYSTORE_B64 fehlt – baue unsigniert (nur zum Testen des Builds)"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: App-Datei bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :app:bundleRelease --no-daemon
      - name: Schlüssel-Fingerabdruck anzeigen (für die Android-Verknüpfung assetlinks.json)
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias upload | grep -E "SHA256:" || true
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nahfuchs-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Fertige App-Datei im Zweig android-release ablegen (zum Hochladen in die Play Console)
        if: env.KEYSTORE_FILE != ''
        run: |
          mkdir -p "$RUNNER_TEMP/rel" && cp android/app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/rel/nahfuchs.aab"
          cd "$RUNNER_TEMP/rel"
          echo "Version ${{ github.run_number }} – gebaut aus ${{ github.sha }}" > VERSION.txt
          git init -q && git checkout -q -b android-release
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Android-App Version ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-release
