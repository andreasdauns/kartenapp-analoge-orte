name: OSM-Daten zählen (Recherche)

# Zählt in den OSM-Daten für Deutschland, wie oft bestimmte Merkmale vorkommen
# (z. B. Annahme von Batterien oder Elektro-Kleingeräten). Nur per Hand gestartet, ändert nichts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Deutschland laden
        run: curl -sSfL --retry 3 -A "analoge-orte (github.com/andreasdauns/kartenapp-analoge-orte)" -o de.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
      - name: Zählen
        run: |
          osmium tags-filter de.pbf nwr/changing_table nwr/amenity=changing_table nwr/diaper 'nwr/changing_table:*' -o w.pbf --overwrite
          {
            echo "## OSM-Zählung Wickelplätze Deutschland ($(date -u +%F))"
            echo '```'
            echo "--- changing_table / diaper (Werte)"
            osmium tags-count w.pbf changing_table diaper amenity=changing_table -s count-desc
            echo "--- Objekte mit changing_table=yes oder limited: Art (amenity/shop/leisure/tourism)"
            osmium tags-filter w.pbf nwr/changing_table=yes,limited nwr/amenity=changing_table nwr/diaper=yes -o y.pbf --overwrite
            osmium tags-count y.pbf amenity shop leisure tourism highway building -s count-desc | head -40
            echo "--- Zusatzangaben"
            osmium tags-count y.pbf changing_table:location changing_table:fee changing_table:access changing_table:wheelchair toilets:wheelchair fee access wheelchair opening_hours -s count-desc | head -40
            echo "--- Läden (shop) mit Wickelplatz, nach Marke/Betreiber"
            osmium tags-filter y.pbf nwr/shop -o s.pbf --overwrite
            osmium tags-count s.pbf brand -s count-desc | head -25
            echo "--- Toiletten gesamt und davon mit changing_table"
            osmium tags-filter de.pbf nwr/amenity=toilets -o t.pbf --overwrite
            osmium tags-count t.pbf amenity=toilets changing_table -s count-desc
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
