name: OSM-Daten zählen (Recherche)

# Zählt in den OSM-Daten für Deutschland, wie oft bestimmte Merkmale vorkommen
# (z. B. Annahme von Batterien oder Elektro-Kleingeräten). Nur per Hand gestartet, ändert nichts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Deutschland laden
        run: curl -sSfL --retry 3 -A "analoge-orte (github.com/andreasdauns/kartenapp-analoge-orte)" -o de.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
      - name: Zählen
        run: |
          osmium tags-filter de.pbf nwr/changing_table nwr/amenity=changing_table nwr/diaper nwr/toilets:changing_table -o w.pbf --overwrite
          osmium export w.pbf -f geojsonseq -o w.geojsonseq --overwrite -x print_record_separator=false
          tally() { jq -r "$1" w.geojsonseq | sort | uniq -c | sort -rn | head -${2:-25}; }
          {
            echo "## OSM-Zählung Wickelplätze Deutschland ($(date -u +%F))"
            echo '```'
            echo "--- Werte changing_table"; tally '.properties.changing_table // "-"'
            echo "--- Werte toilets:changing_table"; tally '.properties["toilets:changing_table"] // empty'
            echo "--- Wickelplätze (yes/limited/room/bench oder amenity=changing_table): Art"
            SEL='select((.properties.changing_table // "" | test("^(yes|limited|room|bench)$")) or .properties.amenity=="changing_table" or (.properties["toilets:changing_table"] // "" | test("^(yes|limited|room|bench)$")))'
            jq -r "$SEL | 1" w.geojsonseq | wc -l
            jq -r "$SEL | (if .properties.shop then \"shop=\"+.properties.shop elif .properties.amenity then \"amenity=\"+.properties.amenity elif .properties.tourism then \"tourism=\"+.properties.tourism elif .properties.leisure then \"leisure=\"+.properties.leisure else \"sonst\" end)" w.geojsonseq | sort | uniq -c | sort -rn | head -40
            echo "--- Marken (brand/name) bei Läden"
            jq -r "$SEL | select(.properties.shop) | (.properties.brand // .properties.name // \"-\")" w.geojsonseq | sort | uniq -c | sort -rn | head -30
            echo "--- changing_table:location"
            jq -r "$SEL | .properties[\"changing_table:location\"] // empty" w.geojsonseq | tr ';' '\n' | sort | uniq -c | sort -rn | head -15
            echo "--- access"
            jq -r "$SEL | .properties.access // \"-\"" w.geojsonseq | sort | uniq -c | sort -rn | head -10
            echo "--- mit opening_hours"
            jq -r "$SEL | select(.properties.opening_hours) | 1" w.geojsonseq | wc -l
            echo "--- je Bundesland grob nicht möglich; Beispiel Bad Neuenahr-Ahrweiler (Umkreis ~8 km)"
            jq -r "$SEL | .geometry.coordinates | flatten | .[0:2] | @tsv" w.geojsonseq | awk '{x=$1;y=$2; if (x>7.0 && x<7.25 && y>50.48 && y<50.6) n++} END{print n+0}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
