name: Daten aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # täglich ca. 4:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Melde-Datenbank wach halten
        continue-on-error: true
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" src/config.js || true)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" src/config.js || true)
          [ -n "$URL" ] && curl -s -o /dev/null -w "Supabase: %{http_code}\n" "$URL/rest/v1/reports?select=id&limit=1" -H "apikey: $KEY" || true
      - name: Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: OpenStreetMap-Daten laden und filtern
        run: bash scripts/fetch-osm.sh
      - name: Kacheln für die App bauen
        run: node --max-old-space-size=6144 scripts/build-data.mjs work/all.geojsonseq
      - name: Arbeitsdateien entfernen
        run: rm -rf work node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
