name: Daten aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # täglich ca. 4:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Orte aus OpenStreetMap holen
        id: data
        continue-on-error: true
        run: node scripts/build-data.mjs

      - name: Neue Daten im Repository speichern
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pois.json
          git diff --cached --quiet || (git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
