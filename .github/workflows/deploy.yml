name: Daten aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # täglich ca. 4:17 Uhr deutscher Zeit
  workflow_dispatch:

# Nur die Rechte, die das Veröffentlichen auf GitHub Pages braucht
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04 # feste Version: Test-Browser (Playwright) brauchen Pakete von 24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Melde-Datenbank wach halten
        continue-on-error: true
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" src/config.js || true)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" src/config.js || true)
          [ -n "$URL" ] && curl -s -o /dev/null -w "Supabase: %{http_code}\n" -X POST "$URL/rest/v1/rpc/reports_in_box" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"s":54.0,"w":8.0,"n":54.01,"e":8.01}' || true
      - name: Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: OpenStreetMap-Daten laden und filtern
        run: bash scripts/fetch-osm.sh
      - name: Overture Maps laden
        continue-on-error: true
        run: python3 -m pip install -q --break-system-packages duckdb==2.0.0 && python3 scripts/overture.py
      - name: Kacheln für die App bauen
        run: node --max-old-space-size=6144 scripts/build-data.mjs work/all.geojsonseq
      - name: Daten prüfen (Doppelte, Lücken, Einbrüche gegenüber gestern)
        env:
          ALLOW_DROP: ${{ contains(github.event.head_commit.message, '[Rückgang ok]') }}
        run: node scripts/check-data.mjs --prev https://nahfuchs.de/data/index.json
      - name: Test-Browser installieren
        run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium webkit firefox && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Klick-Test der App (Chrome, Safari-Technik, Firefox; Handy und PC)
        env:
          STRICT: '1'
          HEADED_FIREFOX: '1' # Firefox mit virtuellem Bildschirm, damit die Karte (WebGL) per Software läuft
        run: xvfb-run -a node scripts/ui-check.mjs || (echo "Zweiter Versuch …" && xvfb-run -a node scripts/ui-check.mjs)
      - name: Arbeitsdateien entfernen
        run: rm -rf work node_modules
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true # .well-known/assetlinks.json (Android-Verknüpfung) muss mit
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
